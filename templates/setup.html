
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your PIN</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 320px;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border-radius: 8px;
        }

        input {
            border: 1px solid #cbd5e1;
        }

        button {
            background: #172554;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Create Your PIN</h2>
        <p>Set a private PIN to protect your wallet.</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <input
                type="password"
                name="pin"
                placeholder="Create PIN"
                inputmode="numeric"
                required
            >

            <input
                type="password"
                name="confirm_pin"
                placeholder="Confirm PIN"
                inputmode="numeric"
                required
            >

            <button type="submit">Save My PIN</button>
        </form>
    </div>
</body>
</html>
